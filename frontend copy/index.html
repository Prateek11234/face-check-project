<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Registration</h2>
        <form method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="id_name">Name:</label>
                <input type="text" id="id_name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="id_age">Age:</label>
                <input type="number" id="id_age" name="age" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="id_dob">Date of Birth:</label>
                <input type="date" id="id_dob" name="dob" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="id_enrollment_number">Enrollment Number:</label>
                <input type="text" id="id_enrollment_number" name="enrollment_number" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="id_photo">Photo:</label>
                <input type="file" id="id_photo" name="photo" accept="image/*" class="form-control">
                <button type="button" id="take_photo" class="btn btn-secondary mt-2">Take Photo</button>
                <video id="video" width="200" height="150" autoplay style="display:none;"></video>
                <canvas id="canvas" width="200" height="150" style="display:none;"></canvas>
                <img id="photo_preview" src="#" alt="Photo Preview" style="display:none;">
            </div>
            <div class="form-group">
                <label for="id_signature">Signature:</label>
                <input type="file" id="id_signature" name="signature" accept="image/*" class="form-control">
                <button type="button" id="draw_signature" class="btn btn-secondary mt-2">Draw Signature</button>
                <canvas id="signature_canvas" width="400" height="100" style="display:none;"></canvas>
                <button type="button" id="clear_signature" class="btn btn-warning mt-2" style="display:none;">Clear</button>
                <button type="button" id="save_signature" class="btn btn-success mt-2" style="display:none;">Save</button>
                <img id="signature_preview" src="#" alt="Signature Preview" style="display:none;">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
