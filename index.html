<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="face-api/face-api.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Student Registration</h2>
        <form method="post" enctype="multipart/form-data" action="/remove-background">
            <div class="form-group">
                <label for="id_name">Name:</label>
                <input type="text" id="id_name" name="name" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="id_age">Age:</label>
                <input type="number" id="id_age" name="age" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="id_dob">Date of Birth:</label>
                <input type="date" id="id_dob" name="dob" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="id_enrollment_number">Enrollment Number:</label>
                <input type="text" id="id_enrollment_number" name="enrollment_number" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="id_photo">Photo:</label>
                <div class="photo-container">
                    <span class="photo-label">Live Camera Feed</span>
                    <video id="video" width="640" height="480" autoplay muted></video>
                </div>

                <div class="photo-container">
                    <span class="photo-label">Selected Image</span>
                    <canvas id="canvas"></canvas>
                </div>

                <div class="controls mt-2">
                    <button type="button" id="capture" class="btn btn-secondary">Capture Photo</button>
                    <button type="button" id="browse" class="btn btn-secondary">Browse Photo</button>

                    <!-- Hidden buttons for internal use -->
                    <button type="button" id="rotate" style="display: none;">Rotate to Landscape</button>
                    <button type="button" id="crop" style="display: none;">Crop Face</button>
                    <button type="button" id="checkBg" style="display: none;">Check Background</button>
                    <button type="button" id="checkStatus" style="display: none;">Check Status</button>
                    <button type="button" id="checkFrontal" style="display: none;">Check Frontal</button>

                    <!-- Main action -->
                    <button type="button" id="processPhoto" class="btn btn-success mt-2">Process Photo</button>
                    <input type="file" id="fileInput" name="photo" accept="image/*" style="display: none;">
                </div>

                <!-- Output status -->
                <div id="status" class="mt-4 p-3 border rounded bg-light">
                    <p>Status will appear here</p>
                </div>
            </div>

            <div class="form-group">
                <label for="id_signature">Signature:</label>
                <input type="file" id="id_signature" name="signature" accept="image/*" class="form-control">

                <h3>Uploaded Signature:</h3>
                <img id="signature_preview" src="#" alt="Uploaded Signature" style="display:none; width:300px; border:1px solid #ccc;">

                <h3>Processed Signature (Background Removed):</h3>
                <img id="processed_signature" src="#" alt="Processed Signature" style="display:none; width:300px; border:1px solid #ccc;">
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
